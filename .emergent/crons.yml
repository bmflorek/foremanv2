crons:
  - name: morning-digest
    description: "Emails the overdue jobs / units out 7+ days digest to the shop list at 6:30am New York time"
    cron: "30 6 * * *"
    timezone: "America/New_York"
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
